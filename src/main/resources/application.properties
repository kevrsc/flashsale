spring.application.name=flashsale

flashsale.admission.bound=2

spring.datasource.url=jdbc:postgresql://localhost:5432/flashsale
spring.datasource.username=flashsale
spring.datasource.password=flashsale

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.modulith.events.externalization.mode=outbox
spring.autoconfigure.exclude=org.springframework.modulith.events.config.EventPublicationAutoConfiguration

spring.flyway.enabled=true

spring.jpa.hibernate.ddl-auto=none
