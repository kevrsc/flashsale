spring.application.name=sale
server.port=8081
spring.threads.virtual.enabled=true
spring.main.keep-alive=true

spring.datasource.url=jdbc:postgresql://localhost:5432/flashsale
spring.datasource.username=flashsale
spring.datasource.password=flashsale
spring.flyway.enabled=true
spring.flyway.table=sale_flyway_schema_history

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.template.observation-enabled=true
spring.kafka.consumer.group-id=sale-qualification
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.missing-topics-fatal=false

sale.relay-delay=200ms
sale.report-delay=200ms

management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
management.tracing.sampling.probability=1
